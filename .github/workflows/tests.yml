name: Tests

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Save vendor folder
        uses: actions/upload-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor
          compression-level: 0
          retention-days: 1

  quality:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring
          coverage: none

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish --no-check-lock

      - name: Run PHP CS Fixer
        run: composer lint

      - name: Run PHPStan
        run: composer phpstan

      - name: Audit Composer dependencies
        run: composer audit

  unit-tests:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring
          coverage: none

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Run unit tests
        run: composer test

  integration-tests:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring
          coverage: none

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Run integration tests
        run: composer test-integration

  code-coverage:
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: xdebug, mbstring
          coverage: xdebug

      - name: Restore vendor folder
        uses: actions/download-artifact@v4
        with:
          name: vendor-${{ matrix.php-version }}
          path: vendor

      - name: Add permissions for executables
        run: chmod -R +x vendor/bin

      - name: Require full line coverage
        run: composer code-coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.php-version }}
          path: build/testcoverage
          retention-days: 5
